<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>番茄鐘時間管理 App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <h1>番茄鐘時間管理</h1>
        <p>純前端任務卡片 + 管理頁面，儲存到 Google 試算表</p>
      </div>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab active" data-view="cardView">專注卡片</button>
      <button class="tab" data-view="manageView">管理頁面</button>
    </div>

    <main class="main-content">
      <section class="view active" id="cardView">
        <div class="flip-card" id="flipCard" tabindex="0" aria-label="任務卡片，點擊翻面">
          <div class="flip-card-inner" id="flipCardInner">
            <div class="flip-card-front">
              <div class="card-title">今日專注任務</div>
              <div class="task-name" id="taskName">尚未新增任務</div>
              <div class="timer-display" id="timerDisplay">25:00</div>
              <div class="timer-controls">
                <button id="startBtn">開始</button>
                <button id="pauseBtn" disabled>暫停</button>
              </div>
            </div>

            <div class="flip-card-back">
              <div class="detail-row">
                <h3>詳細備忘</h3>
                <p id="taskMemo">請在管理頁新增任務後，回到此處檢視細節。</p>
              </div>
              <div class="detail-row">
                <h3>預估番茄鐘</h3>
                <p id="taskEstimate">0</p>
              </div>
              <div class="detail-row">
                <h3>番茄鐘歷史專注次數</h3>
                <p id="taskHistory">0</p>
              </div>
              <div class="detail-row">
                <h3>今日執行心得筆記</h3>
                <p id="taskNote">-</p>
              </div>
            </div>
          </div>
        </div>
        <p class="hint">點擊卡片翻面查看任務細節</p>
      </section>

      <section class="view" id="manageView">
        <h2>任務管理</h2>
        <form id="taskForm">
          <label>任務名稱
            <input type="text" id="taskNameInput" placeholder="輸入任務名稱" required>
          </label>

          <label>詳細備忘
            <textarea id="taskMemoInput" rows="3" placeholder="例如：準備週會簡報、專注寫報告"></textarea>
          </label>

          <label>預估花費時間（番茄鐘數）
            <input type="text" id="taskEstimateInput" placeholder="例如：2 顆番茄鐘"></input>
          </label>

          <label>番茄鐘歷史專注次數
            <input type="number" id="taskHistoryInput" min="0" value="0"></input>
          </label>

          <label>今日執行心得筆記
            <textarea id="taskNoteInput" rows="3" placeholder="例如：先完成最重要的步驟，再檢查細節"></textarea>
          </label>

          <div class="form-actions">
            <button type="button" id="autoFillBtn">自動填入</button>
            <button type="submit" id="saveBtn">儲存任務</button>
          </div>
        </form>
        <div class="form-message" id="formMessage">儲存後會將任務資料送到 GAS 後端。</div>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
